[package]
name = "librqbit-tracker-comms"
version.workspace = true
edition = "2024"
description = "Common interface around various sha1 implementations used in rqbit torrent client."
license = "Apache-2.0"
documentation = "https://docs.rs/librqbit-tracker-comms"
repository = "https://github.com/ikatson/rqbit"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
tokio.workspace = true
anyhow.workspace = true
futures.workspace = true
async-stream.workspace = true
buffers.workspace = true
librqbit-core.workspace = true
byteorder.workspace = true
serde.workspace = true
serde_derive.workspace = true
urlencoding.workspace = true
rand.workspace = true
tracing.workspace = true
reqwest = { workspace = true, features = ["json"] }
bencode.workspace = true
url.workspace = true
parking_lot.workspace = true
tokio-util.workspace = true
librqbit-dualstack-sockets.workspace = true
backon.workspace = true
itertools.workspace = true
serde_with.workspace = true

[features]
# Exposes the fake HTTP tracker of `test_support` to downstream test suites,
# so librqbit's session-level announce tests drive the same harness as this
# crate's own. The tokio features are the ones that harness needs and the
# plain dependency above does not enable.
test-support = ["tokio/net", "tokio/io-util", "tokio/rt", "tokio/sync", "tokio/time", "tokio/macros"]

[dev-dependencies]
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
